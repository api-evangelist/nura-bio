apis:
- aid: nura-bio:nura-bio-content-api
  name: Nura Bio Content API
  description: >-
    The anonymously readable WordPress REST content API behind nurabio.com. It serves the company news
    archive (9 posts), the six evergreen site pages, the 11-profile leadership, board and founders
    directory carried on the Avada `portfolio` custom post type, the 84-item media library, taxonomy
    terms, the public author projection, and cross-type search as JSON. Nura Bio does not market or
    document this as a product API; it is the WordPress CMS surface its own website is built on,
    catalogued here because it is a real, credential-free, machine-readable interface. Twenty-four GET
    operations were verified live on 2026-08-26; every write operation and the aioseo/v1,
    wp-abilities/v1, wp-analytify/v1, duplicate-post/v1, wp-site-health/v1 and wp-block-editor/v1
    namespaces are authentication-gated.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://nurabio.com/wp-json
