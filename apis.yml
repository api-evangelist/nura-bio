aid: nura-bio
name: Nura Bio
description: >-
  Nura Bio, Inc. is a clinical-stage biopharmaceutical company headquartered in South San Francisco,
  California, developing neuroprotective small-molecule medicines that halt neurodegeneration before it
  progresses. Conceived in 2018 by The Column Group together with scientific founders Steve McKnight, PhD
  and Marc Freeman, PhD, the company targets SARM1 — a neuronally enriched NAD hydrolase that acts as an
  axon-intrinsic metabolic sensor and central driver of axonal degeneration — on the thesis that
  intervening early in that pathway confers durable structural and functional neuroprotection across
  peripheral, central and ocular nervous-system disorders. Its pipeline is led by NB-4746, a
  first-generation oral, brain-penetrant, reversible orthosteric SARM1 inhibitor in a global Phase 1b/2a
  study in ALS, and NB-9402, a mechanistically differentiated second-generation oral, covalent,
  irreversible, allosteric inhibitor completing a Phase 1a healthy-volunteer study in 2026. Nura Bio
  launched publicly in January 2020 with a $73 million Series A, extended that round with $68 million to
  pass $140 million raised, and closed a $73.8 million Series B in June 2026 led by The Column Group with
  Euclidean Capital, Samsara BioCapital and Sanofi Ventures; Shilpa Sambashivan, PhD, a co-founder and
  its chief scientist, serves as CEO. Its science is published in NEURON and CELL REPORTS. Nura Bio runs
  no developer program and publishes no product API, developer portal, API reference, SDK or pricing.
  The only machine-readable surfaces reachable without credentials are a published llms.txt and the
  WordPress REST content API behind nurabio.com, which serves the news archive, site pages, people
  directory and media library as JSON — both catalogued here.
