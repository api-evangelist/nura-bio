openapi: 3.1.0
info:
  title: Nura Bio Content API
  version: wp/v2
  summary: Anonymously readable WordPress REST content API behind nurabio.com.
  description: >-
    The read-only content surface Nura Bio exposes at https://nurabio.com/wp-json. Nura Bio is a clinical-stage
    biopharmaceutical company in South San Francisco, California developing oral, brain-penetrant small-molecule
    inhibitors of SARM1 — a neuronally enriched NAD hydrolase that drives axon degeneration — for peripheral,
    central and ocular nervous-system disorders. Nura Bio runs no developer program and markets no product API.
    This document is an API Evangelist derivation of the WordPress `wp/v2` and `oembed/1.0` route index the site
    publishes at /wp-json/, restricted to the operations verified to return data anonymously on 2026-08-26. All
    write operations, `/wp/v2/settings`, the `aioseo/v1` plugin-administration namespace, the `wp-abilities/v1`
    abilities registry, the `wp-analytify/v1`, `duplicate-post/v1`, `wp-site-health/v1` and `wp-block-editor/v1`
    namespaces, and the autosave/revision subtrees are authentication-gated and deliberately excluded — see x-api-evangelist-provenance.
  contact:
    name: Nura Bio
    url: https://nurabio.com/contact/
  x-api-evangelist-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the live WordPress REST route index at https://nurabio.com/wp-json/
    (269 routes across 8 namespaces: oembed/1.0, aioseo/v1, duplicate-post/v1, wp-analytify/v1, wp/v2, wp-site-health/v1,
    wp-block-editor/v1, wp-abilities/v1), harvested verbatim to openapi/_original/nura-bio-wp-json-route-index.json
    and verified against live anonymous responses on 2026-08-26. Every query parameter below is copied from that
    route index `args` block for that endpoint — type, enum, default, minimum and maximum included — and every
    collection count quoted in a description was read from the X-WP-Total response header on that date. Nura Bio
    publishes no OpenAPI, no developer documentation and no API reference for this surface; the wp/v2 contract
    itself is defined upstream by the WordPress REST API handbook. The deployment is WordPress on Kinsta behind
    Cloudflare (`x-kinsta-cache` / `ki-edge` response headers), previously on Flywheel — the media `guid` values
    still carry the pre-rebrand proneurotech.flywheelsites.com origin and /robots.txt is still the stale default
    Flywheel file. The theme is Avada. API responses carry `x-robots-tag: noindex`. Nothing here was obtained with credentials.
servers:
- url: https://nurabio.com/wp-json
  description: Production content API
tags:
- name: posts
  description: The company news archive — press releases and financing, clinical and publication announcements.
- name: pages
  description: 'The six evergreen site pages: Home, About Us, Our Science, News & Literature, Join Us, Contact.'
- name: portfolio
  description: >-
    The people directory — leadership, board of directors, and founders and advisors — carried on the Avada theme
    `portfolio` custom post type and its `portfolio_entries` taxonomy.
- name: media
  description: 'The media library: logo assets, team headshots, scientific figures and press-release documents.'
- name: taxonomy
  description: Category and tag terms applied to the news archive.
- name: directory
  description: Public author projection for users who have published content.
- name: discovery
  description: Route, type, taxonomy, status and oEmbed discovery endpoints that describe the deployment itself.
paths:
  /wp/v2/posts:
    get:
      tags:
      - posts
      operationId: listPosts
      summary: List news posts
      description: >-
        Lists published posts. On this deployment the collection is the Nura Bio news archive — 9 items spanning
        the January 2020 launch announcement through the June 2026 $73.8M Series B. Paginated; X-WP-Total and
        X-WP-TotalPages are exposed via Access-Control-Expose-Headers. Verified 200 anonymously on 2026-08-26
        (X-WP-Total: 9).
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/ModifiedAfter'
      - $ref: '#/components/parameters/Author'
      - $ref: '#/components/parameters/AuthorExclude'
      - $ref: '#/components/parameters/Before'
      - $ref: '#/components/parameters/ModifiedBefore'
      - $ref: '#/components/parameters/Exclude'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/SearchSemantics'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Order'
      - name: orderby
        in: query
        description: Sort collection by post attribute.
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
      - $ref: '#/components/parameters/SearchColumns'
      - $ref: '#/components/parameters/Slug'
      - name: status
        in: query
        description: Limit result set to posts assigned one or more statuses.
        schema:
          type: array
          default: publish
          items:
            type: string
            enum:
            - publish
            - future
            - draft
            - pending
            - private
            - trash
            - auto-draft
            - inherit
            - request-pending
            - request-confirmed
            - request-failed
            - request-completed
            - dp-rewrite-republish
            - any
      - name: tax_relation
        in: query
        description: Limit result set based on relationship between multiple taxonomies.
        schema:
          type: string
          enum:
          - AND
          - OR
      - name: categories
        in: query
        description: Limit result set to items with specific terms assigned in the categories taxonomy.
        schema:
          type: object
      - name: categories_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the categories taxonomy.
        schema:
          type: object
      - name: tags
        in: query
        description: Limit result set to items with specific terms assigned in the tags taxonomy.
        schema:
          type: object
      - name: tags_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the tags taxonomy.
        schema:
          type: object
      - name: sticky
        in: query
        description: Limit result set to items that are sticky.
        schema:
          type: boolean
      - name: ignore_sticky
        in: query
        description: Whether to ignore sticky posts or not.
        schema:
          type: boolean
          default: true
      - name: format
        in: query
        description: Limit result set to items assigned one or more given formats.
        schema:
          type: array
          items:
            type: string
            enum:
            - standard
            - aside
            - chat
            - gallery
            - link
            - image
            - quote
            - status
            - video
            - audio
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/InvalidParam'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /wp/v2/posts/{id}:
    get:
      tags:
      - posts
      operationId: getPost
      summary: Get a news post
      description: >-
        Retrieves a single post by numeric id, including rendered title, content, excerpt and the AIOSEO metadata
        block. Verified 200 anonymously on 2026-08-26 against id 2507 (the Series B announcement).
      parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier for the resource.
        schema:
          type: integer
      - $ref: '#/components/parameters/Context'
      - name: excerpt_length
        in: query
        description: Override the default excerpt length.
        schema:
          type: integer
      - name: password
        in: query
        description: The password for the post if it is password protected.
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/InvalidParam'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
